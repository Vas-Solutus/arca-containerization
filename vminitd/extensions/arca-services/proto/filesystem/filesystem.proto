// Arca Container Filesystem Service Protocol
// gRPC API for container filesystem operations
//
// This service runs on vsock port 51821 in each container's Linux VM
// and provides filesystem operations including:
// - Filesystem sync (flush buffers)
// - Archive operations (tar creation/extraction for buildx)
// - OverlayFS upperdir enumeration (for docker diff)

syntax = "proto3";

package arca.filesystem.v1;

option go_package = "github.com/vas-solutus/arca-services/proto/filesystem";

// FilesystemService manages container filesystem operations
// Runs on vsock port 51821 in container's init system namespace
service FilesystemService {
    // Check if service is fully initialized and ready to handle requests
    // Used by vminitd to verify service startup before allowing container creation
    rpc Ready(ReadyRequest) returns (ReadyResponse);

    // Sync filesystem (flush all cached writes to disk)
    // Calls sync() syscall to ensure all filesystem buffers are written
    // Used before reading container filesystem for accurate diff results
    rpc SyncFilesystem(SyncFilesystemRequest) returns (SyncFilesystemResponse);

    // Enumerate upperdir for container diff (OverlayFS-based change detection)
    // Returns all files in /mnt/vdb/upper (added/modified) and whiteouts (deleted)
    // Much faster than full filesystem enumeration
    rpc EnumerateUpperdir(EnumerateUpperdirRequest) returns (EnumerateUpperdirResponse);

    // Read archive - create tar archive of filesystem path
    // Works universally without requiring tar in container
    // Used for GET /containers/{id}/archive endpoint (buildx)
    rpc ReadArchive(ReadArchiveRequest) returns (ReadArchiveResponse);

    // Write archive - extract tar archive to filesystem path
    // Works universally without requiring tar in container
    // Used for PUT /containers/{id}/archive endpoint (buildx)
    rpc WriteArchive(WriteArchiveRequest) returns (WriteArchiveResponse);

    // Create bind mount - bind mount a file or directory to another location
    // Works like "mount --bind /source /target" inside the container
    // Used for file bind mounts (VirtioFS only supports directory shares)
    rpc CreateBindMount(CreateBindMountRequest) returns (CreateBindMountResponse);

    // Stat path - check if a path exists and get metadata
    // Used for HEAD requests on archive endpoint
    rpc StatPath(StatPathRequest) returns (StatPathResponse);

    // Create volume overlay - create OverlayFS mount for a volume
    // Overlays an EXT4 upper layer on top of VirtioFS lower layer
    // This provides full POSIX compliance (Unix sockets, chmod) while maintaining
    // read access to host files via VirtioFS
    // Used for bind mounts that need both host file access AND POSIX compliance
    rpc CreateVolumeOverlay(CreateVolumeOverlayRequest) returns (CreateVolumeOverlayResponse);

    // Create direct volume mount - bind mount EXT4 directory to container path
    // Creates a directory on the writable EXT4 filesystem and bind mounts it
    // Provides full POSIX compliance without OverlayFS (allows nested overlays)
    // Used for named volumes (local driver) that don't need host file access
    rpc CreateDirectMount(CreateDirectMountRequest) returns (CreateDirectMountResponse);

    // Generate /etc/hosts file for container
    // Creates the standard Docker hosts file with localhost entries and container hostname
    // Docker generates this file; we need to do the same for compatibility
    rpc GenerateHostsFile(GenerateHostsFileRequest) returns (GenerateHostsFileResponse);
}

// Request to check service readiness
message ReadyRequest {
    // No parameters needed
}

// Response indicating service readiness
message ReadyResponse {
    // True if service is fully initialized and ready
    bool ready = 1;

    // Service version
    string version = 2;

    // Milliseconds since service started
    int64 uptime_ms = 3;
}

// Request to sync filesystem (flush all cached writes)
message SyncFilesystemRequest {
    // No parameters needed
}

message SyncFilesystemResponse {
    // Success status
    bool success = 1;

    // Error message if success = false
    string error = 2;
}

// Request to enumerate OverlayFS upperdir for container diff
message EnumerateUpperdirRequest {
    // No parameters needed - service knows upperdir is at /mnt/vdb/upper
}

message EnumerateUpperdirResponse {
    // Success status
    bool success = 1;

    // Error message if success = false
    string error = 2;

    // Files and directories in upperdir
    repeated UpperdirEntry entries = 3;
}

// Represents a file, directory, or whiteout in the OverlayFS upperdir
message UpperdirEntry {
    // Path relative to container root (e.g., "/etc/hosts", "/tmp/myfile")
    string path = 1;

    // Entry type: "file", "dir", "symlink", "whiteout"
    // "whiteout" indicates a deleted file (character device 0/0 in upperdir)
    string type = 2;

    // File size in bytes (0 for directories and whiteouts)
    int64 size = 3;

    // Modification time (Unix timestamp seconds)
    int64 mtime = 4;

    // File mode/permissions (Unix mode bits)
    uint32 mode = 5;
}

// Request to read archive from filesystem path
message ReadArchiveRequest {
    // Container ID (for resolving /run/container/{id}/rootfs path)
    string container_id = 1;

    // Path to file or directory to archive (e.g., "/tmp/myfile.txt" or "/etc")
    string path = 2;
}

message ReadArchiveResponse {
    // Success status
    bool success = 1;

    // Error message if success = false
    string error = 2;

    // Tar archive data (gzip compressed)
    bytes tar_data = 3;

    // File stat information (for X-Docker-Container-Path-Stat header)
    PathStat stat = 4;
}

// File stat information for archived paths
message PathStat {
    // File or directory name
    string name = 1;

    // File size in bytes
    int64 size = 2;

    // File mode/permissions (os.FileMode as uint32)
    uint32 mode = 3;

    // Modification time (RFC3339 format: "2006-01-02T15:04:05Z07:00")
    string mtime = 4;

    // Symbolic link target (empty if not a symlink)
    string link_target = 5;
}

// Request to write archive to filesystem path
message WriteArchiveRequest {
    // Container ID (for resolving /run/container/{id}/rootfs path)
    string container_id = 1;

    // Destination path where archive should be extracted (e.g., "/tmp")
    string path = 2;

    // Tar archive data to extract
    bytes tar_data = 3;
}

message WriteArchiveResponse {
    // Success status
    bool success = 1;

    // Error message if success = false
    string error = 2;
}

// Request to create a bind mount inside the container
message CreateBindMountRequest {
    // Container ID (for resolving /run/container/{id}/rootfs path)
    string container_id = 1;

    // Source path inside VM (absolute path, e.g., "/mnt/arca-file-mounts/abc123/myfile.txt")
    // Can be a file or directory
    string source = 2;

    // Target path relative to container root (e.g., "/test.txt" or "/app/config.yaml")
    // Will be resolved to /run/container/{container_id}/rootfs{target}
    string target = 3;

    // Read-only mount (default: false for read-write)
    bool read_only = 4;
}

message CreateBindMountResponse {
    // Success status
    bool success = 1;

    // Error message if success = false
    string error = 2;
}

// Request to stat a path (check existence and get metadata)
message StatPathRequest {
    // Container ID (for resolving /run/container/{id}/rootfs path)
    string container_id = 1;

    // Path to stat (e.g., "/tmp/myfile.txt")
    string path = 2;
}

message StatPathResponse {
    // Success status
    bool success = 1;

    // Error message if success = false
    string error = 2;

    // File stat information
    PathStat stat = 3;
}

// Request to create an OverlayFS mount for a volume
// This overlays an EXT4 writable layer on top of a VirtioFS layer
// Provides full POSIX compliance (Unix sockets, chmod) for volumes
message CreateVolumeOverlayRequest {
    // Container ID (for resolving container rootfs path)
    string container_id = 1;

    // Lower layer path - where VirtioFS should be mounted in guest
    // e.g., "/mnt/arca-volumes/{hash}/data"
    // Go will mount the VirtioFS here if not already mounted
    string lower_path = 2;

    // Upper layer identifier - volume name for creating subdirs
    // Used to create /mnt/vdb/volume-overlays/{upper_device}/upper and work
    string upper_device = 3;

    // Target mount path relative to container root
    // e.g., "/var/lib/rancher/k3s"
    // Will be resolved to /run/container/{container_id}/rootfs{target}
    string target = 4;

    // VirtioFS tag for mounting the share if not already mounted
    // This is the hash of the host source path used by the hypervisor
    string virtiofs_tag = 5;
}

message CreateVolumeOverlayResponse {
    // Success status
    bool success = 1;

    // Error message if success = false
    string error = 2;
}

// Request to create a direct EXT4 bind mount for a volume
// This creates a directory on the writable EXT4 filesystem and bind mounts it
// to the container target path. No OverlayFS involved - allows nested overlays.
message CreateDirectMountRequest {
    // Container ID (for resolving container rootfs path)
    string container_id = 1;

    // Volume name - used to create /mnt/writable/volumes/{volume_name}
    string volume_name = 2;

    // Target mount path relative to container root
    // e.g., "/var/lib/rancher/k3s"
    // Will be resolved to /run/container/{container_id}/rootfs{target}
    string target = 3;
}

message CreateDirectMountResponse {
    // Success status
    bool success = 1;

    // Error message if success = false
    string error = 2;
}

// Request to generate /etc/hosts file for a container
// Docker generates this file with localhost entries and container hostname
message GenerateHostsFileRequest {
    // Container ID (for resolving container rootfs path)
    string container_id = 1;

    // Container hostname (typically the short container ID or user-specified hostname)
    string hostname = 2;

    // Container's IP address (e.g., "10.89.0.2")
    string ip_address = 3;

    // Container name (without leading slash, e.g., "my-container")
    string container_name = 4;

    // Extra hosts to add (from --add-host flag)
    // Format: "hostname:ip"
    repeated string extra_hosts = 5;
}

message GenerateHostsFileResponse {
    // Success status
    bool success = 1;

    // Error message if success = false
    string error = 2;
}
